<style>
  .rc-wrap { padding: 12px 16px 40px; }
  .rc-bar { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap;
            padding-bottom: 12px; border-bottom: 1px solid var(--border-color, #e6e9ee); }
  .rc-bar .f { display: flex; flex-direction: column; gap: 3px; }
  .rc-bar label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em;
                  color: var(--text-muted, #6b7683); margin: 0; }
  .rc-bar select, .rc-bar input { height: 30px; font-size: 13px; padding: 2px 8px;
                                  border-radius: 6px; border: 1px solid var(--border-color, #d5dae1);
                                  background: var(--control-bg, #fff); color: inherit; }
  .rc-bar input[type=search] { min-width: 230px; }
  .rc-check { display: inline-flex; align-items: center; gap: 6px; font-size: 13px;
              font-weight: 400; white-space: nowrap; cursor: pointer; margin: 0 0 4px; }
  .rc-check input { margin: 0; }
  .rc-kpis { display: flex; gap: 12px; flex-wrap: wrap; margin: 14px 0 10px; }
  .rc-kpi { flex: 1 1 150px; border: 1px solid var(--border-color, #e6e9ee); border-radius: 10px;
            padding: 10px 12px; background: var(--card-bg, #fff); }
  .rc-kpi .lbl { font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em;
                 color: var(--text-muted, #6b7683); }
  .rc-kpi .val { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .rc-kpi .sub { font-size: 11.5px; color: var(--text-muted, #6b7683); }
  .rc-scroll { overflow-x: auto; border: 1px solid var(--border-color, #e6e9ee);
               border-radius: 10px; }
  .rc-tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .rc-tbl th { text-align: left; font-size: 10.5px; text-transform: uppercase;
               letter-spacing: .04em; color: var(--text-muted, #6b7683); font-weight: 600;
               padding: 8px 10px; border-bottom: 1px solid var(--border-color, #e6e9ee);
               white-space: nowrap; background: var(--subtle-fg, #fafbfc); }
  .rc-tbl td { padding: 7px 10px; border-bottom: 1px solid var(--border-color, #f0f2f5);
               vertical-align: top; }
  .rc-tbl tbody tr:hover { background: var(--subtle-fg, #fafbfc); }
  .rc-tbl .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .rc-nom { font-weight: 600; }
  .rc-meta { color: var(--text-muted, #6b7683); font-size: 11.5px; }
  .rc-rouge { color: #c0392b; font-weight: 600; }
  .rc-vert { color: #1e7e46; }
  .rc-badge { display: inline-block; font-size: 10.5px; padding: 1px 7px; border-radius: 10px;
              border: 1px solid transparent; white-space: nowrap; }
  .rc-alerte { background: #fdecea; color: #a93226; border-color: #f5c6c0; }
  .rc-ok { background: #eaf7ef; color: #1e7e46; border-color: #c6e8d3; }
  .rc-gris { background: #f1f3f5; color: #5c6570; border-color: #e2e6ea; }
  .rc-jaune { background: #fff8e1; color: #8a6100; border-color: #f3e0a8; }
  .rc-act { border: 1px solid var(--border-color, #d5dae1); background: var(--control-bg, #fff);
            border-radius: 6px; padding: 2px 8px; font-size: 11.5px; cursor: pointer;
            color: inherit; white-space: nowrap; }
  .rc-act:hover { background: var(--subtle-fg, #f3f5f7); }
  .rc-vide, .rc-chargement { padding: 26px; text-align: center; color: var(--text-muted, #6b7683); }
  .rc-note { font-size: 12px; color: var(--text-muted, #6b7683); margin: 8px 0 0; }
  .rc-tronque { background: #fff8e1; border: 1px solid #f3e0a8; color: #8a6100;
                border-radius: 8px; padding: 8px 12px; font-size: 12.5px; margin-top: 10px; }
  @media (max-width: 860px) {
    .rc-bar input[type=search] { min-width: 150px; }
    .rc-kpi { flex-basis: 44%; }
  }
</style>

<div class="rc-wrap">
  <div class="rc-bar">
    <div class="f"><label>Recherche</label>
      <input type="search" data-f="recherche" placeholder="nom ou numero de telephone"></div>
    <div class="f"><label>Groupe client</label><select data-f="groupe"></select></div>
    <div class="f"><label>Type</label><select data-f="type">
      <option value="">Tous</option>
      <option value="Company">Societe</option>
      <option value="Individual">Particulier</option>
    </select></div>
    <div class="f"><label>Trier par</label><select data-f="tri">
      <option value="delta_paiement">Ecart de reglement</option>
      <option value="delta_bl">Ecart de livraison</option>
      <option value="commandes">Total commandes</option>
      <option value="paiements">Total reglements</option>
      <option value="nom">Nom</option>
    </select></div>
    <label class="rc-check" for="rc-ecarts">
      <input type="checkbox" id="rc-ecarts" data-f="ecarts" checked> Seulement les ecarts</label>
    <label class="rc-check" for="rc-ignores">
      <input type="checkbox" id="rc-ignores" data-f="ignores" checked> Masquer les clients ignores</label>
    <button class="rc-act" data-action="actualiser">Actualiser</button>
    <button class="rc-act" data-action="excel">Exporter</button>
  </div>
  <div data-role="contenu"><div class="rc-chargement">Chargement…</div></div>
</div>
