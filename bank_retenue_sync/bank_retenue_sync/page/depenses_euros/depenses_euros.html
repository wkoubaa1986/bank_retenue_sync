<style>
  .de-wrap { padding: 12px 16px 40px; max-width: 1100px; }
  .de-bar { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color, #e6e9ee); }
  .de-bar .f { display: flex; flex-direction: column; gap: 3px; }
  .de-bar label, .de-tbl th { font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em;
                              color: var(--text-muted, #6b7683); margin: 0; }
  .de-bar select, .de-bar input, .de-tbl select, .de-tbl input { height: 30px; font-size: 13px; padding: 2px 8px;

  .de-src { font-size: 11.5px; color: var(--text-muted, #6b7683); }
  .de-tbl { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 12px; }
  .de-tbl th, .de-tbl td { padding: 6px 8px; border-bottom: 1px solid var(--border-color, #e6e9ee); vertical-align: middle; }
  .de-tbl td.n, .de-tbl th.n { text-align: right; font-variant-numeric: tabular-nums; }
  .de-tbl input[type=number] { width: 110px; text-align: right; }
  .de-tbl input[type=date] { width: 140px; }
  .de-tbl input.lib { width: 100%; min-width: 220px; }
  .de-tbl select { min-width: 220px; }
  .de-x { cursor: pointer; color: #b91c1c; font-weight: 700; padding: 0 6px; }
  .de-tot { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
  .de-tot .t { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .de-titre { margin: 22px 0 6px; font-size: 13px; font-weight: 700; color: var(--text-muted, #6b7683); text-transform: uppercase; letter-spacing: .04em; }
  .de-hist { font-size: 12.5px; }
  .de-hist td.n { text-align: right; font-variant-numeric: tabular-nums; }

<div class="de-wrap">
